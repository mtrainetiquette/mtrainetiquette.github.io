<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>What do I want?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#FFF8EF; --ink:#3B3557; --muted:#7A7394; --card:#FFFFFF; --line:#EDE4D8;
  --lv0:#FF9EB5; --lv1:#B9A4FF; --lv2:#5FCDBF; --lv3:#FFC94D; --lv4:#7DB8FF; --lv5:#8FD67E;
  --gold:#FFB703; --radius:24px;
}
.lv0{--c:var(--lv0)} .lv1{--c:var(--lv1)} .lv2{--c:var(--lv2)}
.lv3{--c:var(--lv3)} .lv4{--c:var(--lv4)} .lv5{--c:var(--lv5)}
*{box-sizing:border-box}
html{font-size:20px}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;line-height:1.45;overflow-x:hidden}
h1,h2,h3,.brand,.btn,.tile b,.chip,.seg button,.colhead{font-family:'Fredoka','Nunito',system-ui,sans-serif;font-weight:500}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:4px solid var(--lv4);outline-offset:3px}
.ico{display:inline-block;line-height:1}
img.ico{width:1.2em;height:1.2em;object-fit:contain;vertical-align:-.2em}
.ico.big{font-size:2.2rem} img.ico.big{width:2.4rem;height:2.4rem}
.ico.huge{font-size:4.5rem} img.ico.huge{width:5rem;height:5rem}

/* drifting background blobs */
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blobs span{position:absolute;width:42vmax;height:42vmax;border-radius:50%;filter:blur(70px);opacity:.35;animation:drift 28s ease-in-out infinite alternate}
.blobs span:nth-child(1){background:var(--lv0);top:-15vmax;left:-10vmax}
.blobs span:nth-child(2){background:var(--lv1);top:30vh;right:-15vmax;animation-duration:34s}
.blobs span:nth-child(3){background:var(--lv2);bottom:-20vmax;left:20vw;animation-duration:40s}
.blobs span:nth-child(4){background:var(--lv3);top:10vh;left:40vw;width:24vmax;height:24vmax;opacity:.25;animation-duration:24s}
@keyframes drift{to{transform:translate(6vmax,-5vmax) scale(1.15)}}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;flex-wrap:wrap}
.brand{background:none;border:0;font-size:1.3rem;display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:16px}
.brand:hover{background:#ffffff99}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.nav button{border:0;background:#ffffffaa;border-radius:999px;padding:8px 16px;font-size:.85rem;font-family:'Fredoka',sans-serif}
.nav button.on{background:var(--ink);color:#fff}

main{max-width:1000px;margin:0 auto;padding:8px 16px 60px}
main.wide{max-width:none}

/* block fly in / out between views */
.blk{animation:flyIn .65s cubic-bezier(.2,1.25,.4,1) both;animation-delay:calc(var(--i,0) * 70ms)}
.blk.out{animation:flyOut .38s ease-in both;animation-delay:calc(var(--i,0) * 25ms)}
.blk.still{animation:none}
@keyframes flyIn{from{opacity:0;transform:translate(var(--dx,0),var(--dy,40px)) rotate(var(--rot,0)) scale(.6)}}
@keyframes flyOut{to{opacity:0;transform:translate(var(--dx,0),var(--dy,40px)) rotate(var(--rot,0)) scale(.6)}}
.rowin{animation:rowIn .4s ease-out both;animation-delay:calc(var(--i,0) * 40ms)}
@keyframes rowIn{from{opacity:0;transform:translateY(14px)}}

/* buttons, chips, pills */
.btn{border:0;border-radius:999px;padding:14px 26px;font-size:1rem;background:#fff;box-shadow:0 3px 0 #0000000f;transition:transform .15s}
.btn:not(:disabled):hover{transform:translateY(-2px)}
.btn.primary{background:var(--ink);color:#fff}
.btn.soft{background:#ffffffcc}
.btn.ghost{background:transparent;box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips.col{flex-direction:column;align-items:center}
.chip{border:3px solid var(--c,var(--line));background:color-mix(in srgb,var(--c,#fff) 18%,white);border-radius:999px;padding:9px 18px;font-size:.9rem;transition:transform .15s,background .15s}
.chip:hover{transform:translateY(-2px) rotate(-1deg)}
.chip.on{background:var(--c);color:#fff}
.chip.plain{--c:#E3D9CC}
.pill{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--c) 28%,white);border-radius:999px;padding:4px 14px;font-size:.8rem}
.trail{display:flex;flex-wrap:wrap;align-items:center;gap:6px;justify-content:center}
.trail .arrow{color:var(--muted)}
.trail.big .pill{font-size:1rem;padding:8px 18px}
.hint{color:var(--muted);font-size:.85rem;text-align:center}
.toggle{display:inline-flex;align-items:center;gap:10px;font-size:.9rem;cursor:pointer;user-select:none}
.toggle input{width:24px;height:24px;accent-color:var(--ink)}
.star{border:0;background:none;font-size:1.2rem;line-height:1;padding:4px;color:#CFC6BA;transition:transform .2s}
.star:hover{transform:scale(1.25) rotate(-10deg)}
.prio>.star,.star.on{color:var(--gold)}
.seg{display:inline-flex;background:#ffffffaa;border-radius:999px;padding:5px;gap:4px}
.seg button{border:0;background:none;border-radius:999px;padding:10px 20px;font-size:.95rem}
.seg button.on{background:var(--ink);color:#fff}

/* menu */
.menu{text-align:center;padding-top:4vh}
.menu h1{font-size:clamp(2.2rem,6vw,3.6rem);margin:0 0 6px;font-weight:600}
.menu .sub{font-size:1.05rem;color:var(--muted);margin:0 0 36px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px}
.tile{border:0;border-radius:32px;padding:30px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;background:color-mix(in srgb,var(--c) 35%,white);box-shadow:0 8px 0 color-mix(in srgb,var(--c) 55%,white);transition:transform .2s}
.tile:hover{transform:translateY(-6px) rotate(-1deg)}
.tile:nth-child(2):hover{transform:translateY(-6px) rotate(1deg)}
.tile b{font-size:1.35rem}
.tile span.sub2{color:var(--muted);font-size:.85rem}
.tile .ico{font-size:3rem} .tile img.ico{width:3.2rem;height:3.2rem}
.menu .extras{margin-top:40px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;text-underline-offset:4px;font-size:.8rem;padding:6px 10px}

/* wizard */
.wizard{max-width:760px;margin:0 auto;text-align:center}
.dots{display:flex;justify-content:center;gap:10px;margin:6px 0 20px;flex-wrap:wrap}
.dot{width:52px;height:52px;border-radius:50%;border:3px solid var(--c);background:#fff;font-size:1.3rem;opacity:.55;transition:all .25s}
.dot.filled{background:color-mix(in srgb,var(--c) 35%,white);opacity:.85}
.dot.on{opacity:1;transform:scale(1.18);box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 30%,transparent)}
.qcard{background:var(--card);border-radius:36px;padding:30px 28px 26px;box-shadow:0 10px 0 color-mix(in srgb,var(--c) 45%,white);border:3px solid color-mix(in srgb,var(--c) 60%,white)}
.qcard.slide-fwd{animation:slideF .5s cubic-bezier(.2,1.2,.4,1) both}
.qcard.slide-back{animation:slideB .5s cubic-bezier(.2,1.2,.4,1) both}
@keyframes slideF{from{opacity:0;transform:translateX(120px) rotate(4deg)}}
@keyframes slideB{from{opacity:0;transform:translateX(-120px) rotate(-4deg)}}
.qhead{display:flex;flex-direction:column;align-items:center;gap:4px}
.qnum{color:var(--muted);font-size:.8rem}
.qcard h2{font-size:clamp(1.4rem,3.4vw,1.85rem);margin:8px 0 14px;line-height:1.25}
.qcard .trail{margin-bottom:18px}
.qcard .trail::before{content:'Building on:';color:var(--muted);font-size:.8rem;margin-right:4px}
.field{width:100%;font:inherit;font-size:1.15rem;border:3px solid var(--line);border-radius:22px;padding:16px 20px;background:#FFFDF9;color:var(--ink);resize:vertical;transition:border-color .2s}
.field:focus{outline:none;border-color:var(--c,var(--lv4))}
.sugg{margin-top:18px}
.sugg h4{margin:0 0 10px;font-weight:600;color:var(--muted);font-size:.85rem}
.sugg .chips{justify-content:center}
.wiz-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:24px;flex-wrap:wrap}

/* saved */
.saved{text-align:center;max-width:760px;margin:0 auto}
.saved h2{font-size:2rem;margin:8px 0 18px}
.saved h3{margin:36px 0 14px;font-size:1.1rem;color:var(--muted);font-weight:500}
.saved .chip{font-size:.95rem}
.rowbtns{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:34px}

/* explore */
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.toolbar .tools{display:flex;gap:8px;flex-wrap:wrap}
.toolbar .tools button{font-size:.85rem;padding:10px 18px}
.map-scroll{position:relative;overflow:auto;height:calc(100vh - 300px);min-height:380px;background:#ffffff8c;border-radius:32px;border:3px solid #fff}
.map-canvas{position:relative;transition:width .45s,height .45s}
.map-canvas svg{position:absolute;inset:0;pointer-events:none}
.edge{fill:none;stroke:var(--c);stroke-width:4;stroke-linecap:round;opacity:.75}
.band{position:absolute;left:10px;border-radius:28px;transition:top .45s,height .45s,width .45s}
.colhead{position:absolute;top:16px;width:230px;text-align:center;font-size:.8rem;color:var(--muted);transition:opacity .3s}
.mpos{position:absolute;width:230px;height:92px}
.mpos.enter{animation:pop .5s cubic-bezier(.2,1.5,.4,1) both}
.mpos.leave{animation:popOut .3s ease-in both;pointer-events:none}
@keyframes pop{from{opacity:0;transform:scale(.3)}}
@keyframes popOut{to{opacity:0;transform:scale(.3)}}
.mnode{position:relative;width:100%;height:100%;border-radius:22px;background:color-mix(in srgb,var(--c) 22%,white);border:3px solid var(--c);padding:8px 34px 8px 14px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;transition:transform .2s,box-shadow .2s;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 50%,white)}
.mnode:hover{transform:translateY(-3px)}
.mnode.sel{box-shadow:0 0 0 5px var(--ink)}
.mnode.prio{box-shadow:0 0 0 4px var(--gold),0 0 22px #FFB70388}
.mnode.sel.prio{box-shadow:0 0 0 4px var(--gold),0 0 0 8px var(--ink)}
.mnode .star{position:absolute;top:4px;right:4px}
.mtag{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.mtext{font-size:.85rem;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kids{position:absolute;right:-14px;top:50%;transform:translateY(-50%);background:var(--c);color:#fff;border-radius:999px;font-size:.7rem;font-weight:700;padding:3px 9px;border:3px solid #fff}
.selbar{margin-top:14px;background:#fff;border-radius:28px;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;min-height:74px}
.selbar .hint{width:100%;margin:0}
.seltext{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:1rem}
.selbtns{display:flex;gap:8px;flex-wrap:wrap}
.selbtns .btn{padding:10px 18px;font-size:.85rem;background:#F6EFE6}
.empty{text-align:center;padding:40px 0}
.empty p{font-size:1.1rem;color:var(--muted)}

/* table */
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters .field{width:auto;flex:1 1 240px;font-size:1rem;padding:12px 18px}
.filters select.field{flex:0 1 220px;resize:none}
.table-wrap{overflow:auto;background:#fff;border-radius:28px;max-height:calc(100vh - 330px);min-height:300px}
.btable{border-collapse:separate;border-spacing:0;width:100%;min-width:1100px;font-size:.85rem}
.btable th{position:sticky;top:0;background:#fff;z-index:1;text-align:left;padding:14px 10px;font-family:'Fredoka',sans-serif;font-weight:500;border-bottom:3px solid var(--c)}
.btable td{padding:8px 6px;vertical-align:top;border-bottom:2px solid #F5EEE5;width:16.6%}
.btable tr.prio td{background:#FFF8E1}
.tcell{display:flex;gap:4px;align-items:flex-start;background:color-mix(in srgb,var(--c) 18%,white);border-radius:14px;padding:6px 10px 6px 4px}
.tcell.rep{opacity:.45}
.tcell.prio{box-shadow:inset 0 0 0 3px var(--gold)}
.tcell .star{font-size:1rem}
.tcell span{padding-top:3px}
.dash{color:#D8CFC3;padding-left:16px}
mark{background:#FFE58A;border-radius:4px;padding:0 2px}

/* next steps */
.nextv{max-width:800px;margin:0 auto}
.nextv .seg{display:flex;width:max-content;max-width:100%;margin:0 auto 18px}
.nextbar{display:flex;justify-content:center;margin-bottom:16px}
.grouph{display:flex;align-items:center;gap:10px;font-size:1.05rem;margin:26px 0 10px}
.card{display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:24px;padding:16px 18px;margin-bottom:12px;border-left:10px solid var(--c)}
.card .ctext{font-size:1.1rem;font-weight:700}
.crumb{border:0;background:none;padding:2px 0;color:var(--muted);font-size:.8rem;text-align:left}
.crumb:hover{color:var(--ink);text-decoration:underline}
.card .star{font-size:1.5rem}

/* modal + toast */
.modal{position:fixed;inset:0;background:#3B355766;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;animation:fade .25s}
.modal[hidden]{display:none}
@keyframes fade{from{opacity:0}}
.modal-card{background:var(--bg);border-radius:32px;padding:28px;width:min(560px,100%);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.modal-card h3{margin:0 0 14px;font-size:1.35rem}
.modal-card .q{margin:14px 0 10px;color:var(--muted)}
.mbtns{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.btn.danger{background:#E86A7F;color:#fff}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,120px);background:var(--ink);color:#fff;border-radius:999px;padding:14px 26px;transition:transform .4s cubic-bezier(.2,1.4,.4,1);z-index:60;font-size:.95rem}
.toast.show{transform:translate(-50%,0)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* sign-in + account */
.authv{text-align:center;padding-top:4vh}
.authv h1{font-size:clamp(2rem,5vw,3rem);margin:6px 0}
.authv .sub{color:var(--muted);margin:0 0 26px}
.authcard{display:grid;gap:14px;max-width:420px;margin:0 auto}
.authcard .btn{justify-self:center;min-width:200px}
.amsg{min-height:1.4em;margin:0;color:var(--muted);font-size:.9rem}
.authv .extras{margin-top:18px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.nav .acct{background:#fff}
.visrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;font-size:.9rem;color:var(--muted)}
.visrow .field{width:auto;flex:1 1 200px;font-size:1rem;padding:10px 16px}
.wizard .visrow{justify-content:center;margin:0 0 18px}
.people{display:grid;gap:8px;max-height:46vh;overflow:auto;margin-top:8px}
.person{display:flex;align-items:center;gap:10px;justify-content:space-between;background:#fff;border-radius:18px;padding:10px 14px}
.person span{min-width:0;overflow-wrap:anywhere;font-size:.9rem}
.person .field{width:auto;font-size:.9rem;padding:8px 12px}
.ro .star{pointer-events:none}
.ro :not(.prio)>.star:not(.on){visibility:hidden}

/* priority toggle + multi-select */
.startog{border:3px solid var(--gold);background:#fff;border-radius:999px;padding:10px 20px;font-size:.95rem;margin-top:14px;font-family:'Fredoka',sans-serif;transition:transform .15s}
.startog:hover{transform:translateY(-2px)}
.startog.on{background:var(--gold);color:var(--ink)}
.dot.starred::after{content:'★';position:absolute;top:-8px;right:-6px;font-size:.85rem;color:var(--gold)}
.dot{position:relative}
.pickbox{width:30px;height:30px;border-radius:10px;border:3px solid var(--ink);background:#fff;color:transparent;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;font-size:.85rem;line-height:1}
.pickbox.on{background:var(--ink);color:#fff}
.pickbox.some{background:color-mix(in srgb,var(--ink) 35%,white);color:#fff}
.mnode .pickbox{position:absolute;top:-12px;left:-12px;z-index:2}
.mnode.picked{outline:4px dashed var(--ink);outline-offset:4px}
.tcell.picked{box-shadow:inset 0 0 0 3px var(--ink)}
.tcell .vis{margin-left:auto;padding:3px 0 0 6px;font-size:.8rem}
.btable td.pickcol,.btable th.pickcol{width:44px;padding-left:12px}
button.kids{cursor:pointer}
.bulk{display:flex;flex-wrap:wrap;gap:10px;align-items:center;width:100%}
.bulk .btn{padding:10px 16px;font-size:.85rem;background:#F6EFE6}
.bulk .btn.on{background:var(--ink);color:#fff}
.bulk .sep{width:2px;align-self:stretch;background:#EDE4D8;margin:0 4px}
#bulkbar{margin:0 0 14px}
#bulkbar[hidden]{display:none}

/* "Who can see" dropdown + requests */
.who{position:relative;flex:1 1 220px;min-width:200px}
/* lift whatever holds an open dropdown above the blocks that follow it */
.visrow,.selbar,#bulkbar{position:relative}
.visrow:has(details.who[open]),.selbar:has(details.who[open]),#bulkbar:has(details.who[open]){z-index:40}
.who summary{list-style:none;cursor:pointer;font-size:1rem;padding:10px 40px 10px 16px;position:relative;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who summary::-webkit-details-marker{display:none}
.who summary::after{content:'▾';position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--muted)}
.whomenu{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 6px);min-width:260px;background:#fff;border-radius:20px;padding:8px;box-shadow:0 12px 30px #3b35572e;display:flex;flex-direction:column;gap:2px;text-align:left}
.whoopt{display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:14px;padding:10px 12px;font-size:.95rem;text-align:left;width:100%;word-break:break-all}
.whoopt:hover{background:#F6EFE6}
.whoopt .tick{width:22px;height:22px;border-radius:7px;border:2px solid #D8CFC3;color:transparent;display:inline-flex;align-items:center;justify-content:center;font-size:.75rem;flex-shrink:0}
.whoopt.on .tick{background:var(--ink);border-color:var(--ink);color:#fff}
.whoopt small{color:var(--muted)}
.whoopt.add{color:var(--ink);font-weight:700;border-top:2px solid #F5EEE5;border-radius:0 0 14px 14px;margin-top:4px}
.whoaddrow{display:flex;gap:8px;padding:8px 4px 0;border-top:2px solid #F5EEE5;margin-top:4px}
.whoaddrow .field{font-size:.95rem;padding:10px 14px;flex:1;min-width:0}
.whoaddrow .btn{padding:10px 16px;font-size:.9rem}
.bulk .who{flex:0 1 240px}
.notice.request{background:color-mix(in srgb,var(--lv1) 25%,white);justify-content:space-between;text-align:left}
.notice .acts{display:flex;gap:8px}
.status{font-weight:700}
.status.pending{color:#B07A00}
.status.accepted{color:#2E8B57}
.status.declined{color:#C2475B}

/* sharing + sync */
.sync{font-size:.7rem;color:var(--muted);align-self:center}
.sharerow{display:flex;gap:10px;flex-wrap:wrap}
.sharerow .field{flex:1 1 200px;width:auto;font-size:1rem;padding:12px 16px}
.person .btn{padding:8px 14px;font-size:.8rem;flex-shrink:0}
.person .acts{display:flex;gap:6px;align-items:center;flex-shrink:0}
.modal-card h4{margin:22px 0 8px;font-size:.9rem;color:var(--muted);font-weight:600}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:color-mix(in srgb,var(--lv4) 30%,white);border-radius:24px;padding:10px 12px 10px 20px;margin-bottom:14px;font-size:.95rem}
.banner .btn{padding:10px 18px;font-size:.85rem}
.notice{background:#fff;border-radius:24px;padding:16px 20px;margin-top:26px;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.modal-card{max-height:calc(100vh - 32px);overflow:auto}

@media (max-width:640px){
  html{font-size:18px}
  .wiz-nav{justify-content:center}
  .qcard{padding:22px 16px}
  .dot{width:42px;height:42px;font-size:1.05rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="blobs" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
<header class="top">
  <button class="brand" data-act="home" id="brand"></button>

<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
/* ============================================================
   ASSETS — swap any emoji for an image URL (or relative path)
   e.g.  newEntry: 'https://example.com/pencil.png'
   ============================================================ */
const ASSETS = {
  logo: '🌈', saved: '🌟', empty: '🌱',
  newEntry: '✏️', explore: '🗺️', nextSteps: '👣',
  map: '🕸️', table: '📋', priority: '⭐',
  category: '🌱', fantasy: '🦄', realistic: '🧭', done: '🤝', current: '🌤️', next: '👣',
};

const LEVELS = [
  { key: 'category',  label: 'Life area',         noun: 'life area',
    q: 'What part of your life does this fall into?', hint: 'e.g. Work, Home, Friendships, Health…' },
  { key: 'fantasy',   label: 'Fantasy',           noun: 'fantasy version',
    q: "What's the fantasy version, if nothing else was in the way?", hint: "Dream big. No limits, no \"buts\"…" },
  { key: 'realistic', label: 'Realistic version', noun: 'realistic version',
    q: 'What are the realistic versions that might fit your life in the short or long term?', hint: 'A version that could actually fit…' },
  { key: 'done',      label: 'Done & asked',      noun: 'thing done or asked for',
    q: 'What have you done so far, and/or what have you asked others for?', hint: "Things you've tried, or asked someone for…" },
  { key: 'current',   label: 'Happening now',     noun: 'update on what’s happening',
    q: "What's happening currently?", hint: 'Where things stand right now…' },
  { key: 'next',      label: 'Next step',         noun: 'next step',
    q: 'What are the next steps?', hint: 'One small, doable step…' },
];
const LAST = LEVELS.length - 1;
const STARTERS = ['Work', 'Home', 'Friendships', 'Family', 'Health', 'Creativity', 'Money', 'Rest', 'Fun', 'Learning'];
const BANDS = ['#FFE3EC', '#ECE6FF', '#DDF5F1', '#FFF1CC', '#E0EEFF', '#E6F7DF'];
const STORE_KEY = 'whatDoIWant.v1';   // older browser-only saves, offered for import on sign-in

/* ---------- Supabase ---------- */
const SUPABASE_URL = 'https://fbixruzebizpcxmaysnc.supabase.co';
const APP_NAME = 'what_do_i_want';   // row in the site's app_access table
const SUPABASE_KEY = 'sb_publishable_mSL0dy8OKkD1aGgfizGoDw_JXo17tIJ';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
/* Sharing request states, as the owner sees them */
const STATUS = { pending: 'waiting for them', accepted: 'accepted', declined: 'declined' };
/* Site-wide role (set by an admin). It only labels people here: it never decides who sees whose map. */
const ROLES = { admin: 'Admin', family: 'Family', friends: 'Friends', guest: 'Guest' };
let me = null;   // signed-in profile: { id, email, display_name, role }
let shares = { mine: [], withMe: [] };   // requests I've sent / requests sent to me
let viewing = null;                      // { share, nodes } while looking at someone else's map
const readOnly = () => state.view === 'explore' && !!viewing;
const canEdit = () => !!me && !readOnly();
/* The entries on screen: someone's shared map in Explore, otherwise my own */
const nodes = () => readOnly() ? viewing.nodes : db.nodes;
const ownerName = s => s.owner_name || s.owner_email.split('@')[0];
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => s.trim().toLowerCase();
const short = (s, n = 38) => s.length > n ? s.slice(0, n - 1) + '…' : s;
function icon(k, cls = '') {
  const v = ASSETS[k] || '';
  if (/^(https?:|data:|\.{0,2}\/)/.test(v) || /\.(png|jpe?g|gif|svg|webp)$/i.test(v)) return `<img class="ico ${cls}" src="${esc(v)}" alt="">`;
  return `<span class="ico ${cls}" aria-hidden="true">${v}</span>`;
}
let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------- data ---------- */
let db = { nodes: [] };
/* id -> JSON of the row the server last had; save() pushes only the difference */
let synced = new Map();
/* "nodeId|shareId" pairs the server has: which person can see which entry */
let syncedViewers = new Set();
const byId = id => nodes().find(n => n.id === id);
const mineById = id => db.nodes.find(n => n.id === id);
const toRow = n => ({ id: n.id, parent_id: mineById(n.parentId) ? n.parentId : null, level: n.level, text: n.text,
  priority: !!n.priority, created_at: new Date(n.created).toISOString() });
const fromRow = r => ({ id: r.id, parentId: r.parent_id, level: r.level, text: r.text,
  priority: r.priority, viewers: [], created: Date.parse(r.created_at) });
const viewerPairs = () => {
  const ok = new Set(shares.mine.map(sh => sh.id)), out = new Set();
  db.nodes.forEach(n => (n.viewers || []).forEach(sid => { if (ok.has(sid)) out.add(n.id + '|' + sid); }));
  return out;
};
async function loadEntries() {
  const { data, error } = await sb.from('wdiw_nodes').select('*').eq('owner_id', me.id).order('created_at');
  if (error) throw error;
  db = { nodes: data.map(fromRow) };
  synced = new Map(db.nodes.map(n => [n.id, JSON.stringify(toRow(n))]));
  const v = await sb.from('wdiw_node_viewers').select('node_id,share_id');
  if (v.error) throw v.error;
  v.data.forEach(r => mineById(r.node_id)?.viewers.push(r.share_id));
  syncedViewers = new Set(v.data.map(r => r.node_id + '|' + r.share_id));
}
async function loadShares() {
  const { data, error } = await sb.from('wdiw_shares').select('*').order('created_at');
  if (error) throw error;
  shares = { mine: data.filter(s => s.owner_id === me.id), withMe: data.filter(s => s.owner_id !== me.id) };
}
let saveChain = Promise.resolve(), saving = 0, saveFailed = false;
function save() {
  if (!me) return;
  saving++; setSync();
  saveChain = saveChain.then(pushChanges).then(() => { saveFailed = false; }).catch(e => {
    console.error(e); saveFailed = true; toast("Couldn't save to your account. Check your connection and try again.");
  }).finally(() => { saving--; setSync(); });
}
function setSync() { $('#sync').textContent = !me || me.noAccess ? '' : saving ? 'Saving…' : saveFailed ? 'Not saved yet' : 'All saved ✓'; }
async function pushChanges() {
  const now = new Map(db.nodes.map(n => [n.id, JSON.stringify(toRow(n))]));
  const gone = [...synced.keys()].filter(id => !now.has(id));
  const up = [...now].filter(([id, j]) => synced.get(id) !== j).map(([, j]) => JSON.parse(j));
  if (gone.length) {
    const { error } = await sb.from('wdiw_nodes').delete().in('id', gone); if (error) throw error;
    gone.forEach(id => synced.delete(id));
  }
  // The server checks each new row's parent is already yours, so save one generation at a time
  const depth = r => { let d = 0, p = mineById(r.parent_id); while (p) { d++; p = mineById(p.parentId); } return d; };
  const gens = [];
  up.forEach(r => { (gens[depth(r)] ||= []).push(r); });
  for (const g of gens.filter(Boolean)) {
    const { error } = await sb.from('wdiw_nodes').upsert(g); if (error) throw error;
    g.forEach(r => synced.set(r.id, JSON.stringify(r)));
  }
  // Then who can see what (removed entries already took their rows with them)
  const want = viewerPairs(), have = new Set([...syncedViewers].filter(k => mineById(k.split('|')[0])));
  const add = [...want].filter(k => !have.has(k)).map(k => { const [node_id, share_id] = k.split('|'); return { node_id, share_id }; });
  const drop = [...have].filter(k => !want.has(k));
  if (add.length) {
    const { error } = await sb.from('wdiw_node_viewers').insert(add); if (error) throw error;
  }
  const byShare = {};
  drop.forEach(k => { const [n, sid] = k.split('|'); (byShare[sid] ||= []).push(n); });
  for (const [sid, ids] of Object.entries(byShare)) {
    const { error } = await sb.from('wdiw_node_viewers').delete().eq('share_id', sid).in('node_id', ids); if (error) throw error;
  }
  syncedViewers = want;
}
const uid = () => crypto.randomUUID ? crypto.randomUUID()
  : ([1e7] + -1e3 + -4e3 + -8e3 + -1e11).replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
/* Give imported entries fresh ids so they can't collide with anyone else's */
function withNewIds(list) {
  const ids = new Map(list.map(n => [n.id, uid()]));
  return list.filter(n => n.text && n.level >= 0 && n.level <= LAST).map(n => ({
    id: ids.get(n.id), parentId: ids.get(n.parentId) || null, level: n.level, text: String(n.text).slice(0, 2000),
    priority: !!n.priority, viewers: [], created: Number(n.created) || Date.now() }));
}
/* ---------- who can see an entry ---------- */
const shareById = id => shares.mine.find(sh => sh.id === id);
const viewersOf = n => (n.viewers || []).filter(shareById);
function whoLabel(ids) {
  const emails = ids.map(id => shareById(id)?.viewer_email).filter(Boolean);
  if (!emails.length) return '🔒 Just me';
  return `👥 ${esc(short(emails[0], 26))}${emails.length > 1 ? ` +${emails.length - 1}` : ''}`;
}
const whoIcon = n => viewersOf(n).length ? `👥${viewersOf(n).length}` : '🔒';
/* The "Who can see" dropdown. key = which form it belongs to (see WHO below). */
let whoAdding = null;   // key of the picker showing its "+ Add new" email box
function whoPicker(key, open = false) {
  const sel = WHO[key].get();
  return `<details class="who" id="who-${key}" ${open ? 'open' : ''}>
    <summary class="field" aria-label="Who can see this">${whoLabel(sel)}</summary>
    <div class="whomenu" role="group" aria-label="Who can see this">
      <button class="whoopt ${sel.length ? '' : 'on'}" data-act="whoJustMe" data-k="${key}"><span class="tick">✓</span>🔒 Just me</button>
      ${shares.mine.map(sh => `<button class="whoopt ${sel.includes(sh.id) ? 'on' : ''}" data-act="whoToggle" data-k="${key}" data-s="${sh.id}" aria-pressed="${sel.includes(sh.id)}">
        <span class="tick">✓</span><span>${esc(sh.viewer_email)}${sh.status === 'accepted' ? '' : ` <small>· ${STATUS[sh.status]}</small>`}</span></button>`).join('')}
      ${whoAdding === key
        ? `<div class="whoaddrow"><input id="whoEmail" class="field" type="email" placeholder="Their email address" autocomplete="off" aria-label="Email to share with"><button class="btn primary" data-act="whoAdd" data-k="${key}">Add</button></div>
           <p class="hint" style="text-align:left;margin:4px 6px 0">They’ll get a request to accept or decline. Nothing is visible to them until they accept.</p>`
        : `<button class="whoopt add" data-act="whoAddOpen" data-k="${key}">＋ Add new</button>`}
    </div>
  </details>`;
}
function renderWho(key) {
  const el = $(`#who-${key}`); if (!el) return;
  el.outerHTML = whoPicker(key, el.open);
  if (whoAdding === key) $('#whoEmail')?.focus();
}
/* Create (or reuse) a sharing request for this email; returns the share */
async function requestShare(email) {
  const have = shares.mine.find(sh => sh.viewer_email === email);
  if (have) return have;
  const { data, error } = await sb.from('wdiw_shares')
    .insert({ owner_email: me.email.toLowerCase(), owner_name: me.display_name || null, viewer_email: email }).select().single();
  if (error) throw error;
  shares.mine.push(data);
  return data;
}
const validEmail = email => /^\S+@\S+\.\S+$/.test(email) && email !== me.email.toLowerCase();
const childrenOf = id => nodes().filter(n => n.parentId === id).sort((a, b) => a.level - b.level || a.created - b.created);
const roots = () => nodes().filter(n => !n.parentId || !byId(n.parentId)).sort((a, b) => a.created - b.created);
function addNode(level, text, parentId = null, viewers, priority = false) {
  const n = { id: uid(), level, text: text.trim(), parentId, priority: !!priority,
    viewers: [...(viewers || mineById(parentId)?.viewers || [])], created: Date.now() + db.nodes.length };
  db.nodes.push(n); save(); return n;
}
function ancestors(n) {
  const out = []; let p = n.parentId && byId(n.parentId);
  while (p) { out.unshift(p); p = p.parentId && byId(p.parentId); }
  return out;
}
function descendants(id) {
  const out = [], stack = [id];
  while (stack.length) { const c = stack.pop(); for (const k of nodes()) if (k.parentId === c) { out.push(k); stack.push(k.id); } }
  return out;
}
function removeNode(id) {
  const kill = new Set([id, ...descendants(id).map(n => n.id)]);
  db.nodes = db.nodes.filter(n => !kill.has(n.id)); save();
}
function getUnsorted(create) {
  let u = db.nodes.find(n => n.level === 0 && !n.parentId && n.text === 'Unsorted');
  if (!u && create) u = addNode(0, 'Unsorted');
  return u;
}

/* ---------- view router with flying blocks ---------- */
let state = { view: 'menu' };
let lastTab = 'map';
let busy = false;
function scatter(el) {
  const a = Math.random() * Math.PI * 2, d = 160 + Math.random() * 260;
  el.style.setProperty('--dx', Math.cos(a) * d + 'px');
  el.style.setProperty('--dy', Math.sin(a) * d + 'px');
  el.style.setProperty('--rot', (Math.random() * 40 - 20) + 'deg');
}
function go(view, params = {}) {
  if (busy) return;
  if (view !== 'explore') { viewing = null; pick.on = false; pick.ids.clear(); }
  const blocks = [...document.querySelectorAll('#view .blk')];
  const swap = () => { busy = false; state = { view, ...params }; render(); window.scrollTo(0, 0); };
  if (reduced || !blocks.length) return swap();
  busy = true;
  blocks.forEach((b, i) => { scatter(b); b.style.setProperty('--i', Math.min(i, 8)); b.classList.remove('still'); b.classList.add('out'); });
  setTimeout(swap, 400);
}
function render(opts = {}) {
  const root = $('#view');
  root.className = state.view === 'explore' ? 'wide' : '';
  root.innerHTML = VIEWS[state.view]();
  root.querySelectorAll('.blk').forEach((b, i) => {
    scatter(b); b.style.setProperty('--i', i);
    if (opts.soft && !b.classList.contains('qcard')) b.classList.add('still');
  });
  document.body.classList.toggle('ro', readOnly());
  renderHeader(); setSync();
  AFTER[state.view]?.();
}
function renderHeader() {
  $('#brand').innerHTML = `${icon('logo')}<span>What do I want?</span>`;
  const v = state.view;
  if (!me || me.noAccess) { $('#nav').innerHTML = ''; return; }
  $('#nav').innerHTML = (v === 'menu' ? '' : `
    <button data-act="go" data-view="wizard" class="${v === 'wizard' || v === 'saved' ? 'on' : ''}">${icon('newEntry')} New</button>
    <button data-act="go" data-view="explore" class="${v === 'explore' ? 'on' : ''}">${icon('explore')} Explore</button>
    <button data-act="go" data-view="next" class="${v === 'next' ? 'on' : ''}">${icon('nextSteps')} Next steps</button>`) +
    `<button class="acct" data-act="account" aria-label="Your account and sharing">👤 ${esc(short(me.display_name || me.email || '', 16))}</button>`;
}
/* Soft refresh of whatever is on screen (no fly animation) */
function refresh() {
  if (state.view === 'explore') { (state.tab || 'map') === 'map' ? renderMap() : renderTableBody(); }
  else if (state.view === 'next') renderNextBody();
  else render({ soft: true });
}

/* ---------- wizard state ---------- */
let wiz;
function newWizard() { wiz = { step: 0, dir: 'fwd', viewers: [], answers: LEVELS.map(() => ({ text: '', id: null })) }; }
newWizard();
/* Which existing node would new answers at `step` hang from? '__new__' = a brand new (unsaved) parent */
function wizParent(step) {
  let p = null;
  for (let i = 0; i < step; i++) {
    const a = wiz.answers[i];
    if (a.id) p = a.id; else if (a.text.trim()) p = '__new__';
  }
  if (p === null && step > 0) p = getUnsorted()?.id || '__new__';
  return p;
}
function wizPool(step) {
  if (step === 0) return db.nodes.filter(n => n.level === 0).sort((a, b) => a.text.localeCompare(b.text));
  const p = wizParent(step);
  if (p === '__new__') return [];
  return childrenOf(p).filter(n => n.level === step);
}
function wizRevalidate() {
  for (let i = 1; i <= LAST; i++) {
    const a = wiz.answers[i];
    if (a.id && !wizPool(i).some(n => n.id === a.id)) a.id = null;
  }
}
/* An answer's star: what the person chose here, else the existing entry's own star */
const wizStarred = a => a.priority ?? (a.id ? !!byId(a.id)?.priority : false);
function wizHasAny() { return wiz.answers.some(a => a.id || a.text.trim()); }
function commitWizard() {
  let p = null, last = null, made = 0;
  wiz.answers.forEach((a, i) => {
    if (a.id && byId(a.id)) {
      const old = byId(a.id);
      if (a.priority !== undefined && old.priority !== a.priority) { old.priority = a.priority; save(); }
      p = a.id; last = a.id; return;
    }
    const t = a.text.trim(); if (!t) return;
    if (p === null && i > 0) p = getUnsorted(true).id;
    const n = addNode(i, t, p, wiz.viewers, a.priority); p = n.id; last = n.id; made++;
  });
  return { last, made };
}
function wizGoStep(s, dir) {
  wiz.step = Math.max(0, Math.min(LAST, s)); wiz.dir = dir;
  wizRevalidate(); render({ soft: true });
}
function wizFinish() {
  if (!wizHasAny()) { toast("Nothing to save yet, and that's okay."); return; }
  const { last, made } = commitWizard();
  if (!made) { toast('That was all already saved.'); }
  go('saved', { lastId: last });
}

/* ---------- views ---------- */
const VIEWS = {
  loading() { return `<section class="menu"><p class="blk sub">Loading…</p></section>`; },

  noaccess() {
    return `<section class="authv">
      <div class="blk">${icon('logo', 'huge')}</div>
      <h1 class="blk">You don’t have access to this app yet</h1>
      <p class="blk sub">You’re signed in as ${esc(me.email)} · Site role: ${ROLES[me.role] || 'Guest'}.<br>
        Ask the person who runs this site to let you in. Nothing you’ve written before has been lost.</p>
      <div class="blk extras">
        <button class="btn" data-act="recheck">Check again</button>
        <button class="btn ghost" data-act="signOut">Sign out</button>
      </div>
    </section>`;
  },

  auth() {
    const up = auth.mode === 'up';
    return `<section class="authv">
      <div class="blk">${icon('logo', 'huge')}</div>
      <h1 class="blk">What do I want?</h1>
      <p class="blk sub">${up ? 'Make an account. Everything you add is private unless you choose to share it.' : 'Sign in to your private space.'}</p>
      <form class="blk authcard" id="authForm">
        ${up ? `<input class="field" id="aName" placeholder="Your name" autocomplete="name" aria-label="Your name">` : ''}
        <input class="field" id="aEmail" type="email" required placeholder="Email" autocomplete="email" aria-label="Email" value="${esc(auth.email)}">
        <input class="field" id="aPass" type="password" required minlength="6" placeholder="Password" autocomplete="${up ? 'new-password' : 'current-password'}" aria-label="Password">
        <button class="btn primary" type="submit">${up ? 'Create account' : 'Sign in'}</button>

      </form>
      <div class="blk extras">
        <button class="linkbtn" data-act="authMode">${up ? 'Already have an account? Sign in' : 'New here? Create an account'}</button>
        ${up ? '' : `<button class="linkbtn" data-act="authReset">Forgot password?</button>`}
      </div>
    </section>`;
  },

  menu() {
    const n = db.nodes.length, stars = db.nodes.filter(x => x.priority).length;
    const steps = db.nodes.filter(x => x.level === LAST).length;
    return `<section class="menu">
      <h1 class="blk">What do I want?</h1>
      <p class="blk sub">Take your time. Nothing here has to be decided today.</p>
      <div class="tiles">
        <button class="blk tile lv0" data-act="go" data-view="wizard">${icon('newEntry')}<b>Enter something new</b><span class="sub2">A wish, a need, a step</span></button>
        <button class="blk tile lv1" data-act="go" data-view="explore">${icon('explore')}<b>Explore my list</b><span class="sub2">${n ? `${n} thing${n === 1 ? '' : 's'} so far` : 'Map it all out'}</span></button>
        <button class="blk tile lv2" data-act="go" data-view="next">${icon('nextSteps')}<b>See my next steps</b><span class="sub2">${steps ? `${steps} step${steps === 1 ? '' : 's'}${stars ? ` · ${stars} starred` : ''}` : 'What could come next'}</span></button>
      </div>
      ${shares.withMe.filter(sh => sh.status === 'pending').map(sh => `<div class="blk notice request">
        <span>📨 <b>${esc(ownerName(sh))}</b> (${esc(sh.owner_email)}) would like to share parts of their map with you.</span>
        <span class="acts"><button class="btn primary" data-act="respond" data-id="${sh.id}" data-v="1">Accept</button><button class="btn" data-act="respond" data-id="${sh.id}" data-v="">Decline</button></span></div>`).join('')}
      ${shares.withMe.some(sh => sh.status === 'accepted') ? `<div class="blk notice"><span>Shared with you:</span>${shares.withMe.filter(sh => sh.status === 'accepted').map(sh =>
        `<button class="chip lv4" data-act="viewShared" data-id="${sh.id}">${icon('map')} ${esc(short(ownerName(sh), 24))}’s map</button>`).join('')}</div>` : ''}
      <div class="blk extras">
        ${n ? '' : `<button class="linkbtn" data-act="sample">Try it with example entries</button>`}
        <button class="linkbtn" data-act="account">🔒 Private unless you share · Sharing settings</button>
        <button class="linkbtn" data-act="export">Save a backup</button>
        <button class="linkbtn" data-act="import">Load a backup</button>
        ${n ? `<button class="linkbtn" data-act="reset">Start over</button>` : ''}
      </div>
    </section>`;
  },

  wizard() {
    const L = LEVELS[wiz.step], a = wiz.answers[wiz.step];
    const trail = wiz.answers.slice(0, wiz.step).map((x, i) => x.text.trim() ? `<span class="pill lv${i}">${esc(short(x.text, 30))}</span>` : '').filter(Boolean);
    const input = wiz.step === 0
      ? `<input id="wizInput" class="field" autocomplete="off" placeholder="${esc(L.hint)}" value="${esc(a.text)}" aria-labelledby="qlabel">`

const AFTER = {
  wizard() {
    const inp = $('#wizInput');
    inp.addEventListener('input', () => {
      const a = wiz.answers[wiz.step];
      a.text = inp.value;
      const m = wizPool(wiz.step).find(n => norm(n.text) === norm(inp.value));
      a.id = m ? m.id : null;
      renderSugg(); wizButtons();
    });
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter' && (wiz.step === 0 || e.metaKey || e.ctrlKey)) { e.preventDefault(); ACTIONS.wizNext(); }
    });
    renderSugg(); wizButtons();
    setTimeout(() => inp.focus({ preventScroll: true }), reduced ? 0 : 350);
  },
  auth() {
    $('#authForm').addEventListener('submit', onAuthSubmit);
    setTimeout(() => $(auth.email ? '#aPass' : '#aEmail')?.focus({ preventScroll: true }), reduced ? 0 : 350);
  },
  explore() {
    lastTab = state.tab || 'map';
    M.els = new Map(); M.cur = new Map(); M.bands = new Map(); cancelAnimationFrame(M.raf);
    if (!nodes().length) return;
    if ((state.tab || 'map') === 'map') {
      const L = renderMap();
      if (state.focus && L.pos.has(state.focus)) {
        const p = L.pos.get(state.focus), sc = $('#mapScroll');
        sc.scrollTo({ left: Math.max(0, p.x - 120), top: Math.max(0, p.y - 140) });
      }
    } else {
      const s = $('#tSearch'), c = $('#tCat'), p = $('#tPrio');
      s.value = tf.q; c.value = byId(tf.cat) ? tf.cat : ''; p.checked = tf.prio;
      s.addEventListener('input', () => { tf.q = s.value; renderTableBody(); });
      c.addEventListener('change', () => { tf.cat = c.value; renderTableBody(); });
      p.addEventListener('change', () => { tf.prio = p.checked; renderTableBody(); });
      renderTableBody(); renderBulk();
    }
  },
  next() { renderNextBody(); },
};

/* ---------- wizard bits ---------- */
function wizButtons() {
  const a = wiz.answers[wiz.step], has = a.text.trim() || a.id;
  $('#wizNextBtn').textContent = wiz.step === LAST ? 'Save ✓' : has ? 'Next →' : 'Skip →';

}
function renderSugg() {
  const a = wiz.answers[wiz.step], q = norm(a.text);
  let pool = wizPool(wiz.step);
  if (q && !a.id) pool = pool.filter(n => norm(n.text).includes(q));
  let html = '';
  if (pool.length) {
    html += `<h4>${wiz.step === 0 ? 'Life areas you’ve used before' : 'Or build on one you already wrote'}</h4>
      <div class="chips">${pool.slice(0, 10).map(n => `<button class="chip lv${wiz.step} ${a.id === n.id ? 'on' : ''}" data-act="wizChip" data-id="${n.id}">${a.id === n.id ? '✓ ' : ''}${esc(short(n.text, 44))}</button>`).join('')}</div>`;
  }
  if (wiz.step === 0) {
    const used = new Set(db.nodes.filter(n => n.level === 0).map(n => norm(n.text)));
    const ideas = STARTERS.filter(s => !used.has(norm(s)) && (!q || norm(s).includes(q)) && norm(s) !== q);
    if (ideas.length && !a.id) html += `<h4 style="margin-top:16px">Some ideas</h4><div class="chips">${ideas.slice(0, 8).map(s => `<button class="chip plain" data-act="wizChip" data-text="${esc(s)}">${esc(s)}</button>`).join('')}</div>`;
  }
  $('#sugg').innerHTML = html;
}

/* ---------- mind map ---------- */
const NW = 230, NH = 92, COLW = 285, ROWH = 112, PADX = 26, PADY = 64, GAP = 44;
const M = { els: new Map(), cur: new Map(), bands: new Map(), raf: 0 };
let expanded = new Set(), selected = null;
/* Multi-select for bulk changes (your own map only) */
const pick = { on: false, ids: new Set(), kids: false, who: [] };
let calmTable = false;
/* Where each "Who can see" dropdown reads and writes its people */
const WHO = {
  wiz:   { get: () => wiz.viewers,                set: v => { wiz.viewers = v; } },
  modal: { get: () => modalState?.viewers || [], set: v => { modalState.viewers = v; } },
  bulk:  { get: () => pick.who,                   set: v => {
    pick.who = v;   // keep the dropdown open: only refresh the buttons that depend on it
    document.querySelectorAll('[data-act=bulkWho][data-v=add],[data-act=bulkWho][data-v=remove]').forEach(b => { b.disabled = !v.length; });
  } },
};   // re-render the table without the row fade-in (used while selecting)

function layoutMap() {
  const pos = new Map(), order = [], bands = [];
  let y = PADY, maxLevel = 0;
  function place(n) {
    order.push(n.id); maxLevel = Math.max(maxLevel, n.level);
    const kids = expanded.has(n.id) ? childrenOf(n.id) : [];
    let ny;
    if (kids.length) { const ys = kids.map(place); ny = (ys[0] + ys[ys.length - 1]) / 2; }
    else { ny = y; y += ROWH; }
    pos.set(n.id, { x: PADX + n.level * COLW, y: ny });
    return ny;
  }
  roots().forEach((r, i) => {
    const top = y; place(r);
    bands.push({ id: r.id, top: top - 16, height: (y - ROWH + NH) - top + 32, color: BANDS[i % BANDS.length] });
    y += GAP;
  });
  const w = PADX * 2 + maxLevel * COLW + NW + 20;
  return { pos, order, bands, maxLevel, w, h: y - GAP + 30 };
}

function nodeHTML(n) {
  const kids = childrenOf(n.id).length, L = LEVELS[n.level];
  const pk = pick.on && !readOnly(), on = pick.ids.has(n.id);
  return `<div class="mnode lv${n.level} ${n.priority ? 'prio' : ''} ${selected === n.id && !pk ? 'sel' : ''} ${pk && on ? 'picked' : ''}" data-act="mnode" data-id="${n.id}" tabindex="0" role="button" aria-expanded="${expanded.has(n.id)}" title="${esc(n.text)}">
    ${pk ? `<button class="pickbox ${on ? 'on' : ''}" data-act="pick" data-id="${n.id}" aria-pressed="${on}" aria-label="Select “${esc(short(n.text, 30))}”">✓</button>` : ''}
    <button class="star" data-act="star" data-id="${n.id}" aria-label="${n.priority ? 'Unmark' : 'Mark'} as priority">${n.priority ? '★' : '☆'}</button>
    <div class="mtag">${icon(L.key)} ${L.label}${canEdit() ? ` <span title="Who can see this: ${whoLabel(viewersOf(n)).replace(/<[^>]*>/g, '')}">· ${whoIcon(n)}</span>` : ''}</div>
    <div class="mtext">${esc(n.text)}</div>
    ${kids ? `<button class="kids" data-act="mexpand" data-id="${n.id}" aria-label="${expanded.has(n.id) ? 'Close' : 'Open'} ${kids} branch${kids === 1 ? '' : 'es'}">${kids} ${expanded.has(n.id) ? '‹' : '›'}</button>` : ''}
  </div>`;
}

function renderMap() {
  const canvas = $('#mapCanvas'); if (!canvas) return { pos: new Map() };
  const L = layoutMap();
  const W = Math.max(L.w, $('#mapScroll').clientWidth - 6);
  canvas.style.width = W + 'px'; canvas.style.height = L.h + 'px';
  const svg = $('#mapEdges'); svg.setAttribute('width', W); svg.setAttribute('height', L.h);

  // category section bands
  const bandWrap = $('#mapBands'), seenB = new Set();
  L.bands.forEach(b => {
    seenB.add(b.id);
    let el = M.bands.get(b.id);
    if (!el) { el = document.createElement('div'); el.className = 'band'; bandWrap.appendChild(el); M.bands.set(b.id, el); }
    Object.assign(el.style, { top: b.top + 'px', height: b.height + 'px', width: (W - 20) + 'px', background: b.color });
  });
  for (const [id, el] of M.bands) if (!seenB.has(id)) { el.remove(); M.bands.delete(id); }

  $('#mapHeads').innerHTML = LEVELS.slice(0, L.maxLevel + 1).map((l, i) =>
    `<div class="colhead" style="left:${PADX + i * COLW}px">${icon(l.key)} ${l.label}</div>`).join('');

  // nodes (pre-order so parents exist before children)
  const seen = new Set();
  for (const id of L.order) {
    seen.add(id);
    const n = byId(id), target = L.pos.get(id);
    let el = M.els.get(id);
    if (!el) {
      el = document.createElement('div'); el.className = 'mpos enter';
      el.addEventListener('animationend', () => el.classList.remove('enter'), { once: true });
      canvas.appendChild(el); M.els.set(id, el);
      const from = (n.parentId && M.cur.get(n.parentId)) || target;
      M.cur.set(id, { ...from });
      el.style.left = from.x + 'px'; el.style.top = from.y + 'px';
    }
    el.innerHTML = nodeHTML(n);
  }
  for (const [id, el] of M.els) if (!seen.has(id)) {
    M.els.delete(id); M.cur.delete(id);
    el.classList.add('leave'); setTimeout(() => el.remove(), 320);
  }
  animateMap(L.pos);
  renderSelbar();
  return L;
}

function animateMap(targets) {
  cancelAnimationFrame(M.raf);
  const from = new Map(); targets.forEach((p, id) => from.set(id, M.cur.get(id) || p));
  const t0 = performance.now(), D = reduced ? 0 : 480;
  const step = now => {
    const k = D ? Math.min(1, (now - t0) / D) : 1, e = 1 - Math.pow(1 - k, 3);
    targets.forEach((p, id) => {
      const f = from.get(id), c = { x: f.x + (p.x - f.x) * e, y: f.y + (p.y - f.y) * e };
      M.cur.set(id, c);
      const el = M.els.get(id); if (el) { el.style.left = c.x + 'px'; el.style.top = c.y + 'px'; }
    });
    drawEdges(targets);
    if (k < 1) M.raf = requestAnimationFrame(step);
  };
  M.raf = requestAnimationFrame(step);
}

function drawEdges(targets) {
  let s = '';
  targets.forEach((_, id) => {
    const n = byId(id);
    if (!n || !n.parentId || !targets.has(n.parentId)) return;
    const a = M.cur.get(n.parentId), b = M.cur.get(id); if (!a || !b) return;
    const x1 = a.x + NW, y1 = a.y + NH / 2, x2 = b.x, y2 = b.y + NH / 2, mx = (x1 + x2) / 2;
    s += `<path class="edge lv${n.level}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`;
  });
  $('#mapEdges').innerHTML = s;
}

function bulkHTML() {
  const k = pick.ids.size;
  if (!k) return `<p class="hint" style="margin:0;width:100%">Tap bubbles${state.tab === 'table' ? ' or rows' : ''} to select them, then choose who can see them all at once.
    <button class="linkbtn" data-act="pickAll">Select everything</button></p>`;
  return `<div class="bulk"><b>${k} selected</b>
    <span class="sep"></span><span class="hint" style="margin:0">People:</span>${whoPicker('bulk')}
    <button class="btn" data-act="bulkWho" data-v="add" ${pick.who.length ? '' : 'disabled'}>Let them see these</button>
    <button class="btn" data-act="bulkWho" data-v="remove" ${pick.who.length ? '' : 'disabled'}>Stop them seeing these</button>
    <button class="btn" data-act="bulkWho" data-v="private">🔒 Make private</button>
    <label class="toggle"><input type="checkbox" id="bulkKids" ${pick.kids ? 'checked' : ''}> and what branches from them</label>
    <span class="sep"></span>
    <button class="btn" data-act="bulkStar" data-v="1">★ Star</button><button class="btn" data-act="bulkStar" data-v="">☆ Unstar</button>
    <button class="linkbtn" data-act="pickNone">Clear selection</button></div>`;
}
function renderBulk() {
  const bar = $('#bulkbar');
  if (bar) { bar.hidden = !pick.on; if (pick.on) bar.innerHTML = bulkHTML(); }
  if (pick.on && $('#selbar')) $('#selbar').innerHTML = bulkHTML();
}
function renderSelbar() {
  const el = $('#selbar'); if (!el) return;
  if (pick.on && !readOnly()) { el.innerHTML = bulkHTML(); return; }
  const n = selected && byId(selected);
  if (!n) { el.innerHTML = `<p class="hint">Tap a bubble to open its branches${canEdit() ? ' · tap ☆ to mark what matters most' : ''}</p>`; return; }
  const L = LEVELS[n.level];
  const head = `<div class="seltext"><span class="pill lv${n.level}">${icon(L.key)} ${L.label}</span><b>${esc(n.text)}</b></div>`;
  if (!canEdit()) { el.innerHTML = head; return; }
  el.innerHTML = `${head}
    <div class="selbtns">
      <button class="btn" data-act="mEdit" title="Change who can see this">${whoLabel(viewersOf(n))}</button>
      <button class="btn" data-act="mPrio">${n.priority ? '★ Unstar' : '☆ Star it'}</button>
      ${n.level < LAST ? `<button class="btn" data-act="mAdd">＋ Add a branch</button>` : ''}
      <button class="btn" data-act="mEdit">✎ Edit</button>
      <button class="btn" data-act="mDel">Remove</button>
    </div>`;
}

/* ---------- table ---------- */
const tf = { q: '', cat: '', prio: false };
function branchRows() {
  const hasKids = new Set(nodes().map(n => n.parentId));
  const rows = nodes().filter(n => !hasKids.has(n.id)).map(leaf => {
    const path = [...ancestors(leaf), leaf], cells = Array(LEVELS.length).fill(null);
    path.forEach(p => { cells[p.level] = p; });
    return { leaf, path, cells };
  });
  const key = r => r.path.map(p => String(p.created).padStart(15, '0')).join('/');
  return rows.sort((a, b) => key(a).localeCompare(key(b)));
}
function highlight(text, q) {
  const t = esc(text); if (!q) return t;
  const re = new RegExp('(' + esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
  return t.replace(re, '<mark>$1</mark>');
}
function renderTableBody() {
  const tb = $('#tbody'); if (!tb) return;
  const pk = pick.on && !readOnly(), box = (ids, label) => {
    const n = ids.filter(id => pick.ids.has(id)).length, cls = n === ids.length ? 'on' : n ? 'some' : '';
    return `<button class="pickbox ${cls}" data-act="pick" data-ids="${ids.join(',')}" aria-pressed="${cls === 'on'}" aria-label="${label}">✓</button>`;
  };
  $('#thead').innerHTML = `<tr>${pk ? '<th class="pickcol"></th>' : ''}${LEVELS.map((l, i) => `<th class="lv${i}">${icon(l.key)} ${l.label}</th>`).join('')}</tr>`;
  const q = norm(tf.q);
  const all = branchRows();
  const rows = all.filter(r =>
    (!tf.cat || r.path[0].id === tf.cat) &&
    (!tf.prio || r.path.some(p => p.priority)) &&
    (!q || r.path.some(p => norm(p.text).includes(q))));
  let prev = [];
  tb.innerHTML = rows.map((r, i) => {
    const html = `<tr class="${calmTable ? '' : 'rowin'} ${r.path.some(p => p.priority) ? 'prio' : ''}" style="--i:${Math.min(i, 12)}">${pk ? `<td class="pickcol">${box(r.path.map(p => p.id), 'Select this whole row')}</td>` : ''}${r.cells.map((n, l) => n
      ? `<td><div class="tcell lv${l} ${n.priority ? 'prio' : ''} ${prev[l] === n.id ? 'rep' : ''} ${pk && pick.ids.has(n.id) ? 'picked' : ''}">${pk ? box([n.id], `Select “${esc(short(n.text, 30))}”`) : ''}<button class="star ${n.priority ? 'on' : ''}" data-act="star" data-id="${n.id}" aria-label="${n.priority ? 'Unmark' : 'Mark'} as priority">${n.priority ? '★' : '☆'}</button><span>${highlight(n.text, tf.q.trim())}</span>${canEdit() ? `<span class="vis" title="Who can see this">${whoIcon(n)}</span>` : ''}</div></td>`
      : `<td><span class="dash">·</span></td>`).join('')}</tr>`;
    prev = r.cells.map(c => c && c.id);
    return html;
  }).join('') || `<tr><td colspan="${LEVELS.length + 1}" class="hint" style="padding:30px">No branches match. Try a different search.</td></tr>`;
  calmTable = false;
  $('#tcount').textContent = `Showing ${rows.length} of ${all.length} branch${all.length === 1 ? '' : 'es'} · faded boxes repeat the row above · tap ☆ to star any box`;
}

const nv = { tab: 'prio', only: false };
function card(n, i) {
  const anc = ancestors(n);
  return `<div class="card lv${n.level} rowin" style="--i:${Math.min(i, 12)}">
    <button class="star ${n.priority ? 'on' : ''}" data-act="star" data-id="${n.id}" aria-label="${n.priority ? 'Unmark' : 'Mark'} as priority">${n.priority ? '★' : '☆'}</button>
    <div><div class="ctext">${esc(n.text)}</div>
    <button class="crumb" data-act="showOnMap" data-id="${n.id}">${anc.length ? anc.map(a => esc(short(a.text, 26))).join(' › ') : 'Show on map'} ↗</button></div>
  </div>`;
}
function renderNextBody() {
  const el = $('#nextBody'); if (!el) return;
  if (nv.tab === 'prio') {
    const prios = db.nodes.filter(n => n.priority);
    if (!prios.length) { el.innerHTML = `<div class="empty rowin">${icon('priority', 'huge')}<p>Nothing starred yet.${canEdit() ? '<br>In Explore, tap ☆ on anything that feels important.' : ''}</p><button class="btn primary" data-act="go" data-view="explore">Go explore</button></div>`; return; }
    let i = 0;
    el.innerHTML = LEVELS.map((L, lv) => {
      const items = prios.filter(n => n.level === lv).sort((a, b) => a.created - b.created);
      if (!items.length) return '';
      return `<h3 class="grouph lv${lv} rowin">${icon(L.key)} ${L.label}</h3>${items.map(n => card(n, i++)).join('')}`;
    }).join('');
  } else {
    let steps = db.nodes.filter(n => n.level === LAST).sort((a, b) => b.priority - a.priority || a.created - b.created);
    if (nv.only) steps = steps.filter(n => n.priority || ancestors(n).some(a => a.priority));
    el.innerHTML = `<div class="nextbar"><label class="toggle"><input type="checkbox" id="nOnly" ${nv.only ? 'checked' : ''}> Only starred steps, or steps that grow from something starred</label></div>` +
      (steps.length ? steps.map(card).join('')
        : `<div class="empty rowin">${icon('next', 'huge')}<p>${nv.only ? 'No next steps connected to a starred item yet.' : 'No next steps yet.'}</p>${canEdit() ? `<button class="btn primary" data-act="go" data-view="wizard">Enter something new</button>` : ''}</div>`);
    $('#nOnly').addEventListener('change', e => { nv.only = e.target.checked; renderNextBody(); });
  }
}

/* ---------- modal ---------- */
let modalState = null;

}
function closeModal() { whoAdding = null; $('#modal').hidden = true; $('#modal').innerHTML = ''; modalState = null; }
function openAdd(parentId) {

    <p class="q" id="mq">${esc(LEVELS[lvl].q)}</p>

    <div class="mbtns"><button class="btn ghost" data-act="closeModal">Cancel</button><button class="btn primary" data-act="mSave">Add</button></div>`,

function openEdit(id) {

  modalState = { viewers: viewersOf(n) };
  openModal(`<h3>Edit ${LEVELS[n.level].noun}</h3><p class="q">${esc(LEVELS[n.level].q)}</p>

    <div class="mbtns"><button class="btn ghost" data-act="closeModal">Cancel</button><button class="btn primary" data-act="mSave">Save</button></div>`,

/* ---------- actions ---------- */
const ACTIONS = {
  home() { if (me) go('menu'); },
  go(t) { const v = t.dataset.view; if (v === 'wizard') newWizard(); go(v, v === 'explore' ? { tab: lastTab } : {}); },
  sample() { loadSample(); toast('Example entries added. Explore away!'); render({ soft: true }); },

  wizNext() { wiz.step === LAST ? wizFinish() : wizGoStep(wiz.step + 1, 'fwd'); },
  wizBack() { wizGoStep(wiz.step - 1, 'back'); },
  wizJump(t) { const s = +t.dataset.step; if (s !== wiz.step) wizGoStep(s, s > wiz.step ? 'fwd' : 'back'); },
  wizSave() { wizFinish(); },
  wizStar() { const a = wiz.answers[wiz.step]; a.priority = !wizStarred(a); wizButtons(); },
  wizChip(t) {
    const a = wiz.answers[wiz.step];
    if (t.dataset.id) {
      if (a.id === t.dataset.id) { a.id = null; }
      else { const n = byId(t.dataset.id); a.id = n.id; a.text = n.text; }
    } else { a.text = t.dataset.text; a.id = null; }
    $('#wizInput').value = a.text; renderSugg(); wizButtons();
  },
  branchFrom(t) {
    const n = byId(t.dataset.id); newWizard(); wiz.viewers = viewersOf(n);
    [...ancestors(n), n].forEach(p => { wiz.answers[p.level] = { text: p.text, id: p.id, priority: undefined }; });
    wiz.step = n.level + 1; go('wizard');
  },

  tab(t) { if ((state.tab || 'map') !== t.dataset.tab) go('explore', { tab: t.dataset.tab }); },
  mnode(t) {
    if (pick.on && !readOnly()) return ACTIONS.pick(t);
    ACTIONS.mexpand(t);
  },
  mexpand(t) {
    const id = t.dataset.id, had = childrenOf(id).length;
    if (had) expanded.has(id) ? expanded.delete(id) : expanded.add(id);
    selected = id;
    const L = renderMap();
    if (had && expanded.has(id)) {
      const p = L.pos.get(id), sc = $('#mapScroll'), need = p.x + COLW + NW + PADX;
      if (need > sc.scrollLeft + sc.clientWidth) sc.scrollTo({ left: need - sc.clientWidth, behavior: reduced ? 'auto' : 'smooth' });
    }
  },
  star(t) { const n = byId(t.dataset.id); n.priority = !n.priority; save(); refresh(); },

  pickMode() {
    pick.on = !pick.on; if (!pick.on) pick.ids.clear();
    const b = $('#pickBtn'); b.textContent = pick.on ? '✓ Done selecting' : '☑ Select several'; b.setAttribute('aria-pressed', pick.on);
    calmTable = true; refresh(); renderBulk();
  },
  pick(t) {
    const ids = t.dataset.ids ? t.dataset.ids.split(',') : [t.dataset.id];
    const all = ids.every(id => pick.ids.has(id));
    ids.forEach(id => all ? pick.ids.delete(id) : pick.ids.add(id));
    calmTable = true; refresh(); renderBulk();
  },
  pickAll() { nodes().forEach(n => pick.ids.add(n.id)); calmTable = true; refresh(); renderBulk(); },
  pickNone() { pick.ids.clear(); calmTable = true; refresh(); renderBulk(); },
  bulkWho(t) {
    const targets = new Set(pick.ids);
    if (pick.kids) pick.ids.forEach(id => descendants(id).forEach(d => targets.add(d.id)));
    const mode = t.dataset.v;
    targets.forEach(id => {
      const n = mineById(id); if (!n) return;
      if (mode === 'private') n.viewers = [];
      else if (mode === 'add') n.viewers = [...new Set([...n.viewers, ...pick.who])];
      else n.viewers = n.viewers.filter(sid => !pick.who.includes(sid));
    });
    save(); calmTable = true; refresh(); renderBulk();
    const who = mode === 'private' ? 'only you can see them now' : `${pick.who.length} ${pick.who.length === 1 ? 'person' : 'people'} ${mode === 'add' ? 'added' : 'removed'}`;
    toast(`${targets.size} item${targets.size === 1 ? '' : 's'} updated: ${who}`);
  },
  whoJustMe(t) { const k = t.dataset.k; WHO[k].set([]); whoAdding = null; renderWho(k); },
  whoToggle(t) {
    const k = t.dataset.k, sid = t.dataset.s, cur = WHO[k].get();
    WHO[k].set(cur.includes(sid) ? cur.filter(x => x !== sid) : [...cur, sid]); renderWho(k);
  },
  whoAddOpen(t) { whoAdding = t.dataset.k; renderWho(whoAdding); },
  async whoAdd(t) {
    const k = t.dataset.k, inp = $('#whoEmail'), email = inp.value.trim().toLowerCase();
    if (!validEmail(email)) { inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); inp.focus(); return; }
    try {
      const sh = await requestShare(email);
      const cur = WHO[k].get(); if (!cur.includes(sh.id)) WHO[k].set([...cur, sh.id]);
      whoAdding = null; renderWho(k);
      toast(sh.status === 'accepted' ? `Added ${email}.` : `Request sent to ${email}. They’ll see it once they accept.`);
    } catch (e) { console.error(e); toast("Couldn't add them. Check your connection."); }
  },
  bulkStar(t) {
    const on = !!t.dataset.v;
    pick.ids.forEach(id => { const n = mineById(id); if (n) n.priority = on; });
    save(); calmTable = true; refresh(); renderBulk();
    toast(`${pick.ids.size} item${pick.ids.size === 1 ? '' : 's'} ${on ? 'starred' : 'unstarred'}`);
  },
  expandAll() { nodes().forEach(n => expanded.add(n.id)); renderMap(); },
  collapseAll() { expanded.clear(); renderMap(); },
  newArea() { openAdd(null); },
  mPrio() { const n = byId(selected); n.priority = !n.priority; save(); renderMap(); },
  mAdd() { openAdd(selected); },
  mEdit() { openEdit(selected); },
  mDel() {
    const n = byId(selected), k = descendants(n.id).length;
    openConfirm(`Remove “${esc(short(n.text, 40))}”?`,
      k ? `This also removes ${k} thing${k === 1 ? '' : 's'} that branch${k === 1 ? 'es' : ''} from it.` : 'You can always add it again later.',
      'Remove', () => { removeNode(n.id); selected = null; refresh(); });
  },
  showOnMap(t) {
    viewing = null;
    const n = byId(t.dataset.id); if (!n) return;
    ancestors(n).forEach(a => expanded.add(a.id)); selected = n.id;
    go('explore', { tab: 'map', focus: n.id });
  },

  ntab(t) { if (nv.tab !== t.dataset.tab) { nv.tab = t.dataset.tab; document.querySelectorAll('.nextv .seg button').forEach(b => b.classList.toggle('on', b === t)); renderNextBody(); } },

  pickLvl(t) {
    const l = +t.dataset.l; modalState.lvl = l;
    document.querySelectorAll('#lvlChips .chip').forEach(c => c.classList.toggle('on', c === t));
    $('#mq').textContent = LEVELS[l].q; const ta = $('#mText'); ta.placeholder = LEVELS[l].hint; ta.className = `field lv${l}`; ta.focus();
  },
  mSave() {
    const ta = $('#mText'), text = ta.value.trim();
    if (!text) { ta.classList.remove('shake'); void ta.offsetWidth; ta.classList.add('shake'); ta.focus(); return; }
    const s = modalState, vis = s.viewers;
    if (s.type === 'add') {
      const n = addNode(s.lvl, text, s.parentId, vis, $('#mStar').checked);
      if (s.parentId) expanded.add(s.parentId);
      selected = n.id;
    } else {
      const n = byId(s.id); n.text = text; n.viewers = [...vis];
      if ($('#mVisKids')?.checked) descendants(n.id).forEach(d => { d.viewers = [...vis]; });
      save();
    }
    closeModal(); refresh();
  },
  mOk() { const f = modalState.onOk; closeModal(); f(); },
  closeModal() { closeModal(); },

  export() {
    const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `what-do-i-want-${new Date().toISOString().slice(0, 10)}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  },
  import() { $('#importFile').click(); },
  reset() {
    openConfirm('Start over?', 'This deletes everything in your account, for everyone you’ve shared with. Save a backup first if you might want it later.', 'Clear everything',
      () => { db = { nodes: [] }; save(); expanded.clear(); selected = null; render({ soft: true }); });
  },

  async viewShared(t) {
    const share = shares.withMe.find(x => x.id === t.dataset.id && x.status === 'accepted'); if (!share) return;
    closeModal();
    const { data, error } = await sb.from('wdiw_nodes').select('*').eq('owner_id', share.owner_id).order('created_at');
    if (error) return toast("Couldn't open that map. It may no longer be shared.");
    viewing = { share, nodes: data.map(fromRow) }; pick.on = false; pick.ids.clear();
    expanded.clear(); selected = null;
    go('explore', { tab: 'map' });
  },
  viewMine() { viewing = null; expanded.clear(); selected = null; go('explore', { tab: state.tab || 'map' }); },
  async shareAdd() {
    const inp = $('#shareEmail'), email = inp.value.trim().toLowerCase();
    if (!validEmail(email)) { inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); inp.focus(); return; }
    if (shares.mine.some(sh => sh.viewer_email === email)) return toast('You’ve already added them.');
    try { await requestShare(email); } catch (e) { return toast("Couldn't add them. Check your connection."); }
    openAccount(); toast(`Request sent to ${email}. Choose what they can see with “Who can see” on any entry.`);
  },
  async respond(t) {
    const accept = !!t.dataset.v;
    const { error } = await sb.rpc('wdiw_respond_share', { share_id: t.dataset.id, accept });
    if (error) return toast("Couldn't answer that request. Try again.");
    await loadShares(); toast(accept ? 'Accepted. You’ll find their map on the main menu.' : 'Declined. They won’t be able to show you anything.');
    if (!$('#modal').hidden) openAccount();
    if (state.view === 'menu') render({ soft: true });
  },
  async reask(t) {
    const { error } = await sb.rpc('wdiw_reask_share', { share_id: t.dataset.id });
    if (error) return toast("Couldn't send that again.");
    await loadShares(); openAccount(); toast('Request sent again.');
  },
  async setRole(t) {
    const { error } = await sb.rpc('set_user_role', { target: t.dataset.id, new_role: t.value });
    if (error) { toast("Couldn't change that role."); return loadPeople(); }
    toast(`Site role is now ${ROLES[t.value]}.`);
  },
  shareDel(t) {
    const sh = [...shares.mine, ...shares.withMe].find(x => x.id === t.dataset.id); if (!sh) return;
    const mine = sh.owner_id === me.id;
    openConfirm(mine ? `Stop sharing with ${esc(sh.viewer_email)}?` : `Remove ${esc(ownerName(sh))}’s map?`,
      mine ? 'They won’t be able to see any of your entries anymore.' : 'You won’t see their map anymore unless they share it again.',
      mine ? 'Stop sharing' : 'Remove', async () => {
        const { error } = await sb.from('wdiw_shares').delete().eq('id', sh.id);
        if (error) return toast("Couldn't change that. Check your connection.");
        if (viewing?.share.id === sh.id) viewing = null;
        if (mine) {   // the server dropped their entry access with the request
          db.nodes.forEach(n => { n.viewers = (n.viewers || []).filter(x => x !== sh.id); });
          syncedViewers = new Set([...syncedViewers].filter(k => !k.endsWith('|' + sh.id)));
        }
        await loadShares(); openAccount(); if (state.view === 'menu') render({ soft: true });
      });
  },

  authMode() { auth.email = $('#aEmail')?.value.trim() || auth.email; auth.mode = auth.mode === 'in' ? 'up' : 'in'; render({ soft: true }); },
  async authReset() {
    const email = $('#aEmail').value.trim(), msg = $('#aMsg');
    if (!email) { msg.textContent = 'Type your email above first.'; $('#aEmail').focus(); return; }
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    msg.textContent = error ? error.message : 'If that email has an account, a reset link is on its way.';
  },
  async setPass() {
    const inp = $('#mPass');
    if (inp.value.length < 6) { inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); inp.focus(); return; }
    const { error } = await sb.auth.updateUser({ password: inp.value });
    if (error) return toast(error.message);
    closeModal(); toast('Password updated.');
  },
  account() { openAccount(); },
  async signOut() { closeModal(); await sb.auth.signOut(); },
  async recheck() {
    const { data: { user } } = await sb.auth.getUser();
    if (user) enterApp(user);
  },
};
/* Actions that change entries: off while viewing someone else's map (RLS blocks them on the server too) */
const WRITE_ACTS = new Set(['star', 'newArea', 'mPrio', 'mAdd', 'mEdit', 'mDel', 'mSave', 'pickMode', 'pick', 'pickAll', 'pickNone', 'bulkWho', 'bulkStar']);

document.addEventListener('click', e => {
  document.querySelectorAll('details.who[open]').forEach(d => { if (!d.contains(e.target)) { d.open = false; if (whoAdding === d.id.slice(4)) whoAdding = null; } });
  if (e.target.id === 'modal') return closeModal();
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled || !ACTIONS[t.dataset.act] || t.tagName === 'SELECT') return;
  const act = t.dataset.act;
  if (!canEdit() && WRITE_ACTS.has(act)) return;
  ACTIONS[act](t, e);
});
document.addEventListener('change', e => {
  if (e.target.dataset.act === 'setRole') ACTIONS.setRole(e.target);
  if (e.target.id === 'bulkKids') pick.kids = e.target.checked;
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'whoEmail') { e.preventDefault(); return ACTIONS.whoAdd(e.target.nextElementSibling); }
  if (e.key === 'Escape' && document.querySelector('details.who[open]')) { document.querySelectorAll('details.who[open]').forEach(d => { d.open = false; }); whoAdding = null; return; }
  if (e.key === 'Escape' && !$('#modal').hidden) return closeModal();
  if (e.key === 'Enter' && e.target.id === 'mText' && (e.metaKey || e.ctrlKey)) return ACTIONS.mSave();
  const t = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && t.dataset?.act && t.tagName !== 'BUTTON' && t.tagName !== 'INPUT' && t.tagName !== 'TEXTAREA') {
    e.preventDefault(); t.click();
  }
});
$('#importFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(txt => {
    const d = JSON.parse(txt);
    if (!d || !Array.isArray(d.nodes)) throw new Error('bad file');
    openConfirm('Load this backup?', `It has ${d.nodes.length} item${d.nodes.length === 1 ? '' : 's'} and will replace what's here now.`, 'Load it',
      () => { db = { nodes: withNewIds(d.nodes) }; save(); expanded.clear(); selected = null; render({ soft: true }); toast('Backup loaded.'); });
  }).catch(() => toast("Hmm, that file couldn't be read.")).finally(() => { e.target.value = ''; });
});
window.addEventListener('resize', () => { if (state.view === 'explore' && (state.tab || 'map') === 'map') renderMap(); });

/* ---------- sign-in + account ---------- */
let auth = { mode: 'in', email: '' };
async function onAuthSubmit(e) {
  e.preventDefault();
  const email = $('#aEmail').value.trim(), password = $('#aPass').value;
  const btn = e.target.querySelector('[type=submit]'), msg = $('#aMsg');
  auth.email = email; btn.disabled = true; msg.textContent = '';
  const res = auth.mode === 'in'
    ? await sb.auth.signInWithPassword({ email, password })
    : await sb.auth.signUp({ email, password, options: {
        emailRedirectTo: location.origin + location.pathname,
        data: { display_name: $('#aName').value.trim() || undefined } } });
  btn.disabled = false;
  if (res.error) { msg.textContent = res.error.message; return; }
  if (auth.mode === 'up' && !res.data.session) msg.textContent = 'Check your email for a link to confirm your account, then sign in here.';
  // a new session is picked up by onAuthStateChange below
}

    </div>
    ${shares.withMe.length ? `<h4>Shared with me</h4><div class="people">${shares.withMe.map(sh => `<div class="person"><span><b>${esc(ownerName(sh))}</b><br>${esc(sh.owner_email)}</span>
      <span class="acts">${sh.status === 'accepted' ? `<button class="btn" data-act="viewShared" data-id="${sh.id}">View</button>`
        : `<button class="btn" data-act="respond" data-id="${sh.id}" data-v="1">Accept</button>${sh.status === 'pending' ? `<button class="btn" data-act="respond" data-id="${sh.id}" data-v="">Decline</button>` : ''}`}
        <button class="btn" data-act="shareDel" data-id="${sh.id}">Remove</button></span></div>`).join('')}</div>` : ''}
    ${me.role === 'admin' ? `<h4>People · site roles</h4>
      <p class="hint" style="text-align:left">Site roles are for the wider site. They don’t give anyone access to maps here, including yours as admin.</p>
      <div class="people" id="people"><p class="hint">Loading…</p></div>` : ''}
    <div class="mbtns"><button class="btn ghost" data-act="signOut">Sign out</button><button class="btn primary" data-act="closeModal">Done</button></div>`,
    { type: 'account' });
  if (me.role === 'admin') loadPeople();
}
async function loadPeople() {
  const { data, error } = await sb.from('profiles').select('id,email,display_name,role').order('created_at');
  const box = $('#people'); if (!box) return;
  if (error) { box.innerHTML = `<p class="hint">Couldn't load people.</p>`; return; }
  box.innerHTML = data.map(p => `<div class="person"><span><b>${esc(p.display_name || '')}</b><br>${esc(p.email || '')}</span>
    <select class="field" data-act="setRole" data-id="${p.id}" aria-label="Site role for ${esc(p.email || '')}" ${p.id === me.id ? 'disabled' : ''}>
      ${Object.entries(ROLES).map(([k, v]) => `<option value="${k}" ${k === p.role ? 'selected' : ''}>${v}</option>`).join('')}</select></div>`).join('');
}
function openNewPassword() {
  openModal(`<h3>Choose a new password</h3>
    <input id="mPass" class="field" type="password" minlength="6" autocomplete="new-password" placeholder="New password" aria-label="New password">
    <div class="mbtns"><button class="btn primary" data-act="setPass">Save password</button></div>`, { type: 'pass' });
}
/* Older browser-only entries: offer to move them into this account once */
function offerLocalImport() {
  let local; try { local = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) {}
  if (!local || !Array.isArray(local.nodes) || !local.nodes.length || !$('#modal').hidden) return;
  const k = local.nodes.length;
  openConfirm('Bring over what’s in this browser?',
    `There ${k === 1 ? 'is 1 thing' : `are ${k} things`} saved in this browser from before you signed in. Add ${k === 1 ? 'it' : 'them'} to your account? They’ll start as “Just me”.`,
    'Bring them over', () => {
      db.nodes.push(...withNewIds(local.nodes));
      save();
      try { localStorage.setItem(STORE_KEY + '.backup', JSON.stringify(local)); localStorage.removeItem(STORE_KEY); } catch (e) {}
      refresh(); toast('Moved into your account.');
    });
}

async function enterApp(user) {
  try {
    const { data, error } = await sb.from('profiles').select('id,display_name,role').eq('id', user.id).maybeSingle();
    if (error) throw error;
    me = { id: user.id, email: user.email, display_name: data?.display_name || user.email.split('@')[0], role: data?.role || 'guest' };
    // The site decides who can use this app; the database enforces the same check
    const access = await sb.rpc('can_use_app', { app_name: APP_NAME });
    if (access.error) throw access.error;
    me.noAccess = !access.data;
    if (!me.noAccess) await Promise.all([loadEntries(), loadShares()]);
  } catch (e) {
    console.error(e); me = null; booted = null;
    state = { view: 'auth' }; render(); toast("Couldn't load your account. Try again in a moment.");
    return;
  }
  expanded.clear(); selected = null; viewing = null; busy = false;
  if (me.noAccess) return go('noaccess');
  go('menu');
  setTimeout(offerLocalImport, 700);
}
function leaveApp() {
  me = null; db = { nodes: [] }; synced = new Map(); shares = { mine: [], withMe: [] }; viewing = null;
  document.body.classList.remove('ro'); closeModal();
  auth.mode = 'in'; busy = false;
  go('auth');
}

let booted;   // user id the app is currently loaded for (null = signed out)
state = { view: 'loading' }; render();
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY') setTimeout(openNewPassword, 0);
  const id = session?.user?.id || null;
  if (id === booted) return;
  booted = id;
  // Supabase calls inside this callback can deadlock, so run them after it returns
  setTimeout(() => id ? enterApp(session.user) : leaveApp(), 0);
});
</script>
</body>
